<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Meidin Workspace </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .welcome-card {
      background: #ffffff;
      padding: 38px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .welcome-logo {
      width: 134px;
      height: auto;
      margin-bottom: 20px;
      object-fit: contain;
    }

    .welcome-title {
      font-size: 24px;
      font-weight: 700;
      color: #0d2a4a;
      margin-bottom: 8px;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: #6c757d;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .quick-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .stat-box {
      background: #f8f9fa;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #e9ecef;
    }

    .stat-number {
      font-size: 20px;
      font-weight: bold;
      color: #0088cc;
    }

    .stat-label {
      font-size: 12px;
      color: #6c757d;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <!-- Logo Meidin Partner Label -->
    <img src="logo-meidin.png" alt="MEIDIN Partner Label" class="welcome-logo">
    
    <h1 class="welcome-title">Selamat Datang di Meidin Workspace </h1>
    <p class="welcome-subtitle">
      Sistem Integrasi Desain, Produksi, dan Manajemen Label. Pilih menu di sebelah kiri untuk mulai mengelola pekerjaan Anda.
    </p>

    <div class="quick-stats">
      <div class="stat-box">
        <div class="stat-number">System Ready</div>
        <div class="stat-label">Status Workspace</div>
      </div>
      <div class="stat-box">
        <div class="stat-number">Smart Production</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-box">
        <div class="stat-number">Smart Label</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat-box">
        <div class="stat-number">Modul Label</div>
        <div class="stat-label">Coming Soon</div>
    </div>
  </div>

</body>
</html>
