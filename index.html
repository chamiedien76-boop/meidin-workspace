<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meidin Workspace</title>
  <style>
    /* Reset CSS dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
    }

    /* TATA LETAK UTAMA (DESKTOP - SIDEBAR DI KIRI) */
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* SIDEBAR DESKTOP */
    .sidebar {
      width: 250px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand-logo {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .brand-logo img {
      width: 35px;
      height: auto;
    }

    .brand-logo h2 {
      font-size: 16px;
      color: #333;
    }

    .nav-menu {
      list-style: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: #555;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #e8f0fe;
      color: #1a73e8;
    }

    /* KONTEN UTAMA (IFRAME HOLDER) */
    .main-content {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #f4f6f9;
    }

    /* IFRAME STYLE (Mencegah masalah klik/overlay) */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .app-frame.active {
      display: block !important;
      pointer-events: auto !important;
      z-index: 1;
    }


    /* ========================================================
       KHUSUS UNTUK APLIKASI HP / ANDROID (LAYAR SEMPIT <= 768px)
       Sidebar otomatis pindah ke ATAS menjadi Navigation Bar
       ======================================================== */
    @media screen and (max-width: 768px) {
      .app-container {
        flex-direction: column; /* Ubah alur elemen dari menyamping ke atas-bawah */
      }

      /* Ubah Sidebar menjadi Topbar di HP */
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 110px;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      }

      .brand-logo {
        padding: 8px 12px;
      }

      .brand-logo h2 {
        font-size: 14px;
      }

      /* Menu scroll horizontal ke samping di HP */
      .nav-menu {
        flex-direction: row;
        overflow-x: auto;
        white-space: nowrap;
        padding: 5px 8px;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .nav-item {
        width: auto;
      }

      .nav-link {
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 6px;
      }

      /* Area Iframe menyesuaikan sisa tinggi layar */
      .main-content {
        width: 100%;
        flex: 1;
        height: calc(100vh - 110px);
      }
    }

@media print {
  /* Sembunyikan sidebar navigasi */
  .sidebar {
    display: none !important;
  }

  /* Buat container & main-content memenuhi halaman cetak */
  .app-container, .main-content {
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
  }

  /* Sembunyikan iframe yang tidak aktif */
  .app-frame {
    display: none !important;
  }

  /* Iframe yang aktif dipaksa tampil penuh */
  .app-frame.active {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
  }
}

  </style>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR / TOPBAR -->
    <nav class="sidebar">
      <div class="brand-logo">
        <img src="./logo-meidin.png" alt="Logo" id="appLogo">
        <h2>Meidin Workspace</h2>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a class="nav-link active" onclick="openPage('appDashboard', this)">🏠 Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appProduction', this)">⚙️ Smart Production</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appLabel', this)">🏷️ Smart Label</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appProsesGambar', this)">✏️ Proses Gambar</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appEstimasiPick', this)">📊 Estimasi Pick</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appViewerUpt', this)">👁️ Viewer UPT</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appMasterFile', this)">📁 Master File Upload</a>
        </li>
      </ul>
    </nav>

    <!-- AREA KONTEN UTAMA (IFRAMES) -->
    <main class="main-content">
      <iframe id="appDashboard" class="app-frame active" src="./dashboard.html"></iframe>
      <iframe id="appProduction" class="app-frame" data-src="./production.html"></iframe>
      <iframe id="appLabel" class="app-frame" data-src="./label.html"></iframe>
      <iframe id="appProsesGambar" class="app-frame" data-src="./x.html"></iframe>
      <iframe id="appEstimasiPick" class="app-frame" data-src="./x.html"></iframe>
      <iframe id="appViewerUpt" class="app-frame" data-src="./viewer-upt.html"></iframe>
      <iframe id="appMasterFile" class="app-frame" data-src="./x.html"></iframe>
    </main>
  </div>

  <script>
    // FUNGSI NAVIGASI PINDAH HALAMAN
    function openPage(iframeId, element) {
      // 1. Sembunyikan semua iframe
      document.querySelectorAll('.app-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      const targetFrame = document.getElementById(iframeId);

      if (targetFrame) {
        // Ambil data-src atau src
        const targetFile = targetFrame.getAttribute('data-src') || targetFrame.getAttribute('src');

        // Load src secara lazily jika belum diisi
        if (!targetFrame.src || targetFrame.src === 'about:blank' || targetFrame.src.endsWith('about:blank')) {
          targetFrame.src = targetFile;
        }

        // Tampilkan frame target
        targetFrame.classList.add('active');
      }

      // 2. Highlight tombol menu yang aktif
      if (element) {
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        element.classList.add('active');
      }
    }

    // LISTENER PESAN DARI IFRAME (UNTUK NAVIGASI & PRINT ELECTRON)
window.addEventListener('message', async function(event) {
  if (!event.data) return;

  // 1. Pindah Halaman
  if (event.data.action === 'openPage') {
    const targetId = event.data.target;
    const targetLink = document.querySelector(`.nav-link[onclick*="${targetId}"]`);
    openPage(targetId, targetLink);
  }

  // 2. Trigger Print PDF dari Iframe ke Electron Main
  if (event.data.action === 'printToPDF') {
    if (window.electronAPI && window.electronAPI.printToPDF) {
      const result = await window.electronAPI.printToPDF(event.data.options || {});
      // Kirim balik balasan ke iframe jika diperlukan
      event.source.postMessage({ action: 'printResult', result: result }, '*');
    } else {
      // Fallback jika dibuka di browser biasa tanpa Electron
      window.print();
    }
  }
});
  </script>

</body>
</html>
