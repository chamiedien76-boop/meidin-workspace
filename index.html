<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meidin Workspace</title>
  <link rel="icon" type="image/png" href="./logo-meidin.png">
  <style>
    /* Reset CSS dasar */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
    }

    /* TATA LETAK UTAMA (DESKTOP - SIDEBAR DI KIRI) */
    .app-container {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
    }

    /* SIDEBAR DESKTOP */
    .sidebar {
      width: 250px;
      height: 100%;
      background-color: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
      transition: width 0.3s ease; /* Transisi halus saat toggle */
      position: relative;
    }

    /* KONDISI SIDEBAR SAAT MINIMIZE/COLLAPSED */
    .sidebar.collapsed {
      width: 65px;
    }

    .brand-logo {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f0f0f0;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer; /* Menandakan bahwa area logo bisa diklik */
      user-select: none;
    }

    .brand-logo img {
      width: 35px;
      height: auto;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .brand-logo:hover img {
      transform: scale(1.08); /* Efek perbesaran halus saat hover logo */
    }

    .brand-logo h2 {
      font-size: 16px;
      color: #333;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    /* Pengaturan teks & ikon saat collapsed */
    .sidebar.collapsed .brand-logo h2,
    .sidebar.collapsed .nav-text {
      display: none;
    }

    .sidebar.collapsed .brand-logo {
      padding: 15px 10px;
      justify-content: center;
    }

    .nav-menu {
      list-style: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
    }

    .nav-item {
      width: 100%;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: #555;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .nav-icon {
      font-style: normal;
      width: 24px;
      display: inline-block;
      text-align: center;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .sidebar.collapsed .nav-link {
      padding: 12px 10px;
      justify-content: center;
    }

    .sidebar.collapsed .nav-icon {
      margin-right: 0;
    }

    .nav-link:hover, .nav-link.active {
      background-color: #e8f0fe;
      color: #1a73e8;
    }

    /* KONTEN UTAMA (IFRAME HOLDER) */
    .main-content {
      flex: 1;
      height: 100%;
      position: relative;
      background-color: #f4f6f9;
    }

    /* IFRAME STYLE */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .app-frame.active {
      display: block !important;
      pointer-events: auto !important;
      z-index: 1;
    }


    /* ========================================================
       KHUSUS UNTUK APLIKASI HP / ANDROID (LAYAR SEMPIT <= 768px)
       ======================================================== */
    @media screen and (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }

      .sidebar, .sidebar.collapsed {
        width: 100%;
        height: auto;
        max-height: 110px;
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      }

      .brand-logo {
        padding: 8px 12px;
        cursor: default; /* Nonaktifkan pointer klik di mobile */
      }

      .brand-logo h2,
      .sidebar.collapsed .brand-logo h2,
      .sidebar.collapsed .nav-text {
        display: block;
        font-size: 14px;
      }

      .nav-menu {
        flex-direction: row;
        overflow-x: auto;
        white-space: nowrap;
        padding: 5px 8px;
        gap: 8px;
        -webkit-overflow-scrolling: touch;
      }

      .nav-item {
        width: auto;
      }

      .nav-link, .sidebar.collapsed .nav-link {
        padding: 8px 12px;
        font-size: 13px;
        border-radius: 6px;
        justify-content: flex-start;
      }

      .nav-icon, .sidebar.collapsed .nav-icon {
        margin-right: 6px;
      }

      .main-content {
        width: 100%;
        flex: 1;
        height: calc(100vh - 110px);
      }
    }

@media print {
  .sidebar {
    display: none !important;
  }

  .app-container, .main-content {
    width: 100% !important;
    height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
  }

  .app-frame {
    display: none !important;
  }

  .app-frame.active {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
  }
}

  </style>
</head>
<body>

  <div class="app-container">
    <!-- SIDEBAR / TOPBAR -->
    <nav class="sidebar" id="sidebar">
      <div class="brand-logo" onclick="toggleSidebar()" title="Klik untuk minimize/expand sidebar">
        <img src="./logo-meidin.png" alt="Logo" id="appLogo">
        <h2>Meidin Workspace</h2>
      </div>

      <ul class="nav-menu">
        <li class="nav-item">
          <a class="nav-link active" onclick="openPage('appDashboard', this)">
            <i class="nav-icon">🏠</i><span class="nav-text">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appProduction', this)">
            <i class="nav-icon">⚙️</i><span class="nav-text">Smart Production</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appLabel', this)">
            <i class="nav-icon">🏷️</i><span class="nav-text">Smart Label</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appProsesGambar', this)">
            <i class="nav-icon">✏️</i><span class="nav-text">Proses Gambar</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appPdfviewer', this)">
            <i class="nav-icon">📊</i><span class="nav-text">PDF Viewer</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appViewerUpt', this)">
            <i class="nav-icon">👁️</i><span class="nav-text">UPT Viewer</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" onclick="openPage('appMasterFile', this)">
            <i class="nav-icon">📁</i><span class="nav-text">Master File </span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- AREA KONTEN UTAMA (IFRAMES) -->
    <main class="main-content">
      <iframe id="appDashboard" class="app-frame active" src="./dashboard.html"></iframe>
      <iframe id="appProduction" class="app-frame" data-src="./production.html"></iframe>
      <iframe id="appLabel" class="app-frame" data-src="./label.html"></iframe>
      <iframe id="appProsesGambar" class="app-frame" data-src="./x.html"></iframe>
      <iframe id="appPdfviewer" class="app-frame" data-src="./pdf-viewer.html"></iframe>
      <iframe id="appViewerUpt" class="app-frame" data-src="./viewer-upt.html"></iframe>
      <iframe id="appMasterFile" class="app-frame" data-src="./master.html"></iframe>
    </main>
  </div>

  <script>
    // FUNGSI TOGGLE SIDEBAR (MINIMIZE / EXPAND VIA KLIK LOGO)
    function toggleSidebar() {
      // Fitur minimize hanya aktif pada layar Desktop (> 768px)
      if (window.innerWidth > 768) {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
      }
    }

    // FUNGSI NAVIGASI PINDAH HALAMAN
    function openPage(iframeId, element) {
      document.querySelectorAll('.app-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      const targetFrame = document.getElementById(iframeId);

      if (targetFrame) {
        const targetFile = targetFrame.getAttribute('data-src') || targetFrame.getAttribute('src');

        if (!targetFrame.src || targetFrame.src === 'about:blank' || targetFrame.src.endsWith('about:blank')) {
          targetFrame.src = targetFile;
        }

        targetFrame.classList.add('active');
      }

      if (element) {
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        element.classList.add('active');
      }
    }

    // LISTENER PESAN DARI IFRAME (TERMASUK UNTUK UNDUH FILE NATIVE)
    window.addEventListener('message', async function(event) {
      if (!event.data) return;

      // 1. Pindah Halaman
      if (event.data.action === 'openPage') {
        const targetId = event.data.target;
        const targetLink = document.querySelector(`.nav-link[onclick*="${targetId}"]`);
        openPage(targetId, targetLink);
      }

      // 2. SIMPAN FILE DARI IFRAME KE APK NATIVE (CAPACITOR) / ELECTRON / WEB
      if (event.data.action === 'saveFile') {
        const { filename, base64Data, requestId } = event.data;
        
        try {
          // Cek jika berjalan di Capacitor APK
          const CapacitorObj = window.Capacitor || (window.parent && window.parent.Capacitor);
          if (CapacitorObj && CapacitorObj.Plugins && CapacitorObj.Plugins.Filesystem) {
            await CapacitorObj.Plugins.Filesystem.writeFile({
              path: filename,
              data: base64Data,
              directory: 'DOCUMENTS',
              recursive: true
            });
            
            alert('File berhasil disimpan ke folder Documents: ' + filename);
            if (event.source) event.source.postMessage({ action: 'saveFileResult', requestId, result: { success: true } }, '*');
            return;
          }

          // Cek jika berjalan di Electron
          if (window.electronAPI && window.electronAPI.saveFile) {
            const res = await window.electronAPI.saveFile({ filename, base64Data });
            if (event.source) event.source.postMessage({ action: 'saveFileResult', requestId, result: res }, '*');
            return;
          }

          // Fallback Web Browser biasa
          const a = document.createElement('a');
          a.href = base64Data.startsWith('data:') ? base64Data : 'data:application/octet-stream;base64,' + base64Data;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          if (event.source) event.source.postMessage({ action: 'saveFileResult', requestId, result: { success: true } }, '*');

        } catch (err) {
          alert('Gagal menyimpan file: ' + err.message);
          if (event.source) event.source.postMessage({ action: 'saveFileResult', requestId, result: { success: false, error: err.message } }, '*');
        }
      }

      // 3. Trigger Print PDF dari Iframe
      if (event.data.action === 'printToPDF') {
        if (window.electronAPI && window.electronAPI.printToPDF) {
          const result = await window.electronAPI.printToPDF(event.data.options || {});
          if (event.source) event.source.postMessage({ action: 'printResult', result: result }, '*');
        } else {
          window.print();
        }
      }

      // 4. Jembatan RPC umum
      if (event.data.action === 'invokeAPI') {
        const { requestId, api, method, args } = event.data;
        let result;
        try {
          const target = window[api];
          if (!target || typeof target[method] !== 'function') {
            throw new Error(`API ${api}.${method} tidak tersedia`);
          }
          const value = await target[method](...(args || []));
          result = { success: true, value };
        } catch (err) {
          result = { success: false, error: err.message };
        }
        if (event.source) event.source.postMessage({ action: 'invokeAPIResult', requestId, result }, '*');
      }
    });
  </script>

</body>
</html>
